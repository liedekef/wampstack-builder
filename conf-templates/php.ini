; ============================================================================
; php.ini for Wampstack Builder
; ----------------------------------------------------------------------------
; Your own settings go in the conf.d subdirectory, as .ini files: PHP reads
; every php\conf.d\*.ini after this file, in alphabetical order, so what you
; put there wins. Use that instead of editing this file: this file is replaced
; with every new version of the stack, your own .ini files in conf.d are not.
;
;     php\conf.d\my.ini
;         memory_limit = 1G
;         date.timezone = "Europe/Brussels"
;         extension = sockets
;
; install.bat points PHP at that directory (PHP_INI_SCAN_DIR), so all you need
; after changing a file in there is: manage.bat restart apache
; ============================================================================


[PHP]
engine = On
short_open_tag = Off
display_errors = On
display_startup_errors = Off
;error_reporting = E_ALL
memory_limit = 512M
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 60
date.timezone = "Europe/Brussels"

extension_dir = "__BASEDIR__/php/ext"

extension=curl
extension=exif
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=mysqli
extension=openssl
extension=pdo_mysql
extension=zip

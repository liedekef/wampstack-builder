; ============================================================================
; my.ini for the Wampstack Builder stack (MariaDB server).
; __BASEDIR__ is replaced by install.bat with the real path, the same way as
; in httpd.conf and php.ini.
;
; Your own settings go in the conf.d subdirectory, as .cnf or .ini files:
; everything in there is read after this file, in alphabetical order, so it
; overrides what is set here. Use that instead of editing this file: this file
; is replaced with every new version of the stack, your own files in conf.d
; are not.
;
;     mariadb\conf.d\my.cnf
;         [mariadb]
;         max_connections = 200
;
; ?includedir instead of !includedir, so a file in conf.d that cannot be read
; is skipped instead of stopping MariaDB. The conf.d directory itself has to
; stay in place: if it is missing, MariaDB refuses to start.
;
; After changing it, restart MariaDB (manage.bat restart mariadb).
; ============================================================================

[client]
port = 3306

[mariadb]
bind-address = 127.0.0.1

?includedir __BASEDIR__/mariadb/conf.d/

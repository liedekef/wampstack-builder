# ============================================================================
# httpd.conf for the Wampstack Builder stack
# __BASEDIR__ is replaced by install.bat with the real path
# (forward slashes, no backslashes, as Apache wants) where the stack
# is extracted, e.g. C:/wampstack.
# ============================================================================
Define SRVROOT "__BASEDIR__/apache24"
Define PHPROOT "__BASEDIR__/php"
Define WEBROOT "__BASEDIR__/htdocs"
Define PMAROOT "__BASEDIR__/phpmyadmin"

ServerRoot "${SRVROOT}"
ServerName localhost
Listen 127.0.0.1:80

ServerAdmin admin@localhost

# --- Core modules ---
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule alias_module modules/mod_alias.so
LoadModule setenvif_module modules/mod_setenvif.so

# --- PHP as an Apache module ---
LoadModule php_module "${PHPROOT}/php8apache2_4.dll"
AddHandler application/x-httpd-php .php
PHPIniDir "${PHPROOT}"

<IfModule dir_module>
    DirectoryIndex index.php index.html
</IfModule>

<IfModule mime_module>
    TypesConfig conf/mime.types
    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz
</IfModule>

LogFormat "%h %l %u %t \"%r\" %>s %b" common
ErrorLog "logs/error.log"
CustomLog "logs/access.log" common
LogLevel warn

<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "${WEBROOT}"
<Directory "${WEBROOT}">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

Alias /phpmyadmin "${PMAROOT}"
<Directory "${PMAROOT}">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# --- HTTPS (self-signed cert, created per machine by install.bat) ---
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so

<IfModule ssl_module>
    Listen 127.0.0.1:443
    SSLRandomSeed startup builtin
    SSLRandomSeed connect builtin

    <VirtualHost 127.0.0.1:443>
        ServerName localhost
        DocumentRoot "${WEBROOT}"
        SSLEngine on
        SSLCertificateFile    "${SRVROOT}/conf/ssl/localhost.crt"
        SSLCertificateKeyFile "${SRVROOT}/conf/ssl/localhost.key"

        <Directory "${WEBROOT}">
            Options -Indexes +FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>

        Alias /phpmyadmin "${PMAROOT}"
        <Directory "${PMAROOT}">
            Options FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>
    </VirtualHost>
</IfModule>

# ============================================================================
# Your own settings
# ----------------------------------------------------------------------------
# Everything in conf/custom/*.conf is read after this file, so what you put
# there wins over everything above. Use that directory instead of editing this
# file: this file is replaced with every new version of the stack, your own
# .conf files in conf/custom are not.
#
# A .conf file in there can contain anything valid in httpd.conf, e.g.
#   <VirtualHost *:8080> ... </VirtualHost>
#   php_admin_value memory_limit 1G
# ============================================================================
IncludeOptional conf/custom/*.conf
